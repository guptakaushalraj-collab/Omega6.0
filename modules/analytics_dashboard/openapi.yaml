openapi: 3.0.3
info:
  title: Analytics Dashboard
  version: 1.0.0
  description: >
    Ingests operational events and derives collection metrics. Push-based —
    never reads another module's datastore.
  license:
    name: MIT
servers:
  - url: http://localhost:4104
    description: Local
paths:
  /api/v1/health:
    get:
      summary: Liveness probe
      responses:
        "200": { description: Service is up }
  /api/v1/event-types:
    get:
      summary: Event types included in derived metrics
      responses:
        "200":
          description: Known event types
          content:
            application/json:
              schema: { type: array, items: { type: string } }
  /api/v1/events:
    post:
      summary: Ingest an operational event
      description: >
        Unknown `type` values are accepted and stored with `known_type: false`,
        then excluded from derived metrics — producers may ship new event types
        ahead of an analytics upgrade.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EventInput" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean }
                  id: { type: string }
                  known_type: { type: boolean }
        "400": { description: Missing type or malformed occurred_at }
    get:
      summary: Query the raw event log
      parameters:
        - { in: query, name: type, schema: { type: string } }
        - { in: query, name: subject_id, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 100, maximum: 1000 } }
      responses:
        "200":
          description: Events, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Event" } }
  /api/v1/summary:
    get:
      summary: Derived operational metrics
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
  /api/v1/trends:
    get:
      summary: Reported vs collected per day
      parameters:
        - { in: query, name: days, schema: { type: integer, default: 7, minimum: 1, maximum: 90 } }
      responses:
        "200":
          description: Daily series, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  days: { type: integer }
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        reported: { type: integer }
                        collected: { type: integer }
components:
  schemas:
    EventInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          example: bin.collected
        subject_id:
          type: string
          description: Bin id; pairs bin.reported with bin.collected for resolution time
        source:
          type: string
          example: worker_dashboard
        occurred_at:
          type: string
          format: date-time
          description: Defaults to now
        payload:
          type: object
          additionalProperties: true
          properties:
            worker_id: { type: string }
            waste_type: { type: string }
    Event:
      allOf:
        - $ref: "#/components/schemas/EventInput"
        - type: object
          properties:
            id: { type: string }
            received_at: { type: string, format: date-time }
            known_type: { type: boolean }
    Summary:
      type: object
      properties:
        totals:
          type: object
          properties:
            events: { type: integer }
            reported: { type: integer }
            collected: { type: integer }
            outstanding: { type: integer }
            notifications_sent: { type: integer }
            routes_optimized: { type: integer }
        collection_rate: { type: number, format: float }
        resolution_minutes:
          type: object
          description: Counts only bins both reported and collected
          properties:
            samples: { type: integer }
            mean: { type: number, format: float }
            p50: { type: number, format: float }
            p90: { type: number, format: float }
        event_counts:
          type: object
          additionalProperties: { type: integer }
        waste_mix:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              count: { type: integer }
              share: { type: number, format: float }
        worker_activity:
          type: array
          items:
            type: object
            properties:
              worker_id: { type: string }
              assigned: { type: integer }
              collected: { type: integer }
