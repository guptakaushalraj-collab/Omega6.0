name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  test-backend:
    name: Backend tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Proves the migrations apply to an empty database, not just to whatever
      # state a developer's machine happens to be in.
      - name: Apply migrations and seed
        run: npm run db:reset
      - run: npm run test:backend

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:frontend

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      # The service worker precaches these by exact path; if a rename ever
      # breaks that, the app silently stops working offline. Fail loudly here.
      - name: Verify the PWA shell shipped
        run: |
          set -euo pipefail
          for asset in index.html manifest.webmanifest sw.js icon.svg; do
            test -f "frontend/dist/$asset" || { echo "missing frontend/dist/$asset"; exit 1; }
          done
          echo "PWA shell assets present"
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  smoke:
    name: API smoke test
    runs-on: ubuntu-latest
    needs: [test-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:reset
      # Starting the real server catches wiring failures that unit tests, which
      # build the app in-process, never exercise.
      - name: Boot the API and exercise it
        run: |
          set -euo pipefail
          npm start &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4000/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4000/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:4000/api/portfolios/pf_demo_core/holdings > /dev/null
          curl -sf http://127.0.0.1:4000/api/sync/snapshot > /dev/null
          echo "smoke test passed"
