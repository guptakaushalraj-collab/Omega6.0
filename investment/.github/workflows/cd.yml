name: CD

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-image:
    name: Verify the published image boots
    runs-on: ubuntu-latest
    needs: [image]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Publishing an image that cannot start is worse than not publishing:
      # boot it, migrate a real database and serve a real request.
      - name: Run the image and hit it
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-$(git rev-parse --short HEAD)"
          docker run -d --name app -p 4000:4000 -v app-data:/data "$IMAGE"
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:4000/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:4000/api/health | grep -q '"status":"ok"'
          curl -sf http://127.0.0.1:4000/ | grep -qi '<div id="root">'
          curl -sf http://127.0.0.1:4000/sw.js > /dev/null
          docker logs app
          docker rm -f app
